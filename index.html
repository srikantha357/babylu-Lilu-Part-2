<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Babylu.exe Has Stopped Working ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Poppins,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,#ffd6e7,transparent 25%),
        radial-gradient(circle at 85% 20%,#ddd2ff,transparent 25%),
        linear-gradient(135deg,#fff7fb,#f8f3ff);
    color:#3e2940;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.app{
    width:min(1050px,94%);
    margin:25px auto;
}

.card{
    min-height:720px;
    border-radius:35px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(100,50,90,.18);
    border:1px solid rgba(255,255,255,.9);
    overflow:hidden;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:25px 35px;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    color:#a06f91;
}

#counter{
    color:#ff6da6;
}

.content{
    min-height:590px;
    display:grid;
    grid-template-columns:45% 55%;
    align-items:center;
    padding:20px 60px;
}

/* ============================= */
/* CHARACTER WORLD */
/* ============================= */

.character-zone{
    height:470px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.character-zone::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffe0ed,#e9ddff);
}

.character{
    position:relative;
    width:180px;
    height:330px;
    z-index:2;
    transform-origin:50% 90%;
}

/* HAIR */

.head{
    position:absolute;
    width:115px;
    height:120px;
    left:32px;
    top:20px;
    z-index:4;
}

.hair-back{
    position:absolute;
    inset:0;
    background:#472c45;
    border-radius:55% 55% 45% 45%;
}

.hair-left,
.hair-right{
    position:absolute;
    width:45px;
    height:80px;
    background:#472c45;
    top:48px;
    border-radius:50%;
}

.hair-left{
    left:-18px;
    transform:rotate(20deg);
}

.hair-right{
    right:-18px;
    transform:rotate(-20deg);
}

/* FACE */

.face{
    position:absolute;
    width:86px;
    height:85px;
    left:14px;
    top:20px;
    background:#ffd9c8;
    border-radius:48% 48% 50% 50%;
    border:2px solid #efbca9;
    z-index:5;
}

.eye{
    position:absolute;
    width:11px;
    height:17px;
    background:#392533;
    border-radius:50%;
    top:35px;
}

.eye.left{
    left:19px;
}

.eye.right{
    right:19px;
}

.blush{
    position:absolute;
    width:18px;
    height:8px;
    background:#ff9eb6;
    border-radius:50%;
    top:53px;
    opacity:.75;
}

.blush.left{
    left:5px;
}

.blush.right{
    right:5px;
}

.mouth{
    position:absolute;
    width:15px;
    height:9px;
    border-bottom:3px solid #9d526c;
    border-radius:50%;
    left:35px;
    top:54px;
}

/* BOW */

.bow{
    position:absolute;
    width:35px;
    height:25px;
    background:#ff6fa8;
    top:8px;
    right:-10px;
    z-index:6;
    border-radius:12px;
    transform:rotate(15deg);
}

.bow::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    background:#ff4f96;
    border-radius:50%;
    left:11px;
    top:6px;
}

/* BODY */

.body{
    position:absolute;
    top:120px;
    left:35px;
    width:110px;
    height:150px;
}

.dress{
    position:absolute;
    width:95px;
    height:130px;
    left:8px;
    top:10px;
    background:linear-gradient(140deg,#ff84b7,#bd8cff);
    clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);
    border-radius:20px;
}

.collar{
    position:absolute;
    width:25px;
    height:20px;
    background:white;
    left:43px;
    top:4px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    z-index:2;
}

/* ARMS */

.arm{
    position:absolute;
    width:18px;
    height:95px;
    background:#ffd9c8;
    border:2px solid #efbca9;
    border-radius:20px;
    top:15px;
    z-index:-1;
    transform-origin:top center;
}

.arm.left{
    left:0;
    transform:rotate(18deg);
}

.arm.right{
    right:0;
    transform:rotate(-18deg);
}

/* LEGS */

.leg{
    position:absolute;
    width:18px;
    height:65px;
    background:#ffd9c8;
    border-radius:15px;
    top:132px;
}

.leg.left{
    left:35px;
}

.leg.right{
    right:35px;
}

.shoe{
    position:absolute;
    width:38px;
    height:17px;
    background:#4b3046;
    border-radius:50%;
    top:55px;
}

.leg.left .shoe{
    left:-12px;
}

.leg.right .shoe{
    right:-12px;
}

/* ============================= */
/* LILU */
/* ============================= */

.lilu{
    position:absolute;
    transform:scale(.7);
    right:-90px;
    bottom:0;
    opacity:.95;
}

.lilu .hair-back{
    background:#24223d;
}

.lilu .bow{
    display:none;
}

.lilu .dress{
    background:linear-gradient(140deg,#6e8cff,#62c4ff);
}

/* ============================= */
/* TEXT */
/* ============================= */

.text{
    padding:20px 10px 20px 35px;
}

.eyebrow{
    color:#ff6fa8;
    font-size:13px;
    font-weight:800;
    letter-spacing:3px;
    margin-bottom:15px;
}

h1{
    font-family:"Baloo 2",sans-serif;
    font-size:clamp(3rem,6vw,5.2rem);
    line-height:.95;
    margin-bottom:25px;
}

.description{
    font-size:17px;
    line-height:1.8;
    color:#654f60;
}

.extra{
    margin-top:22px;
    color:#ff6fa8;
    font-weight:800;
}

/* ============================= */
/* BUTTONS */
/* ============================= */

.progress{
    height:7px;
    margin:0 60px;
    background:#f1e3ec;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:14%;
    background:linear-gradient(90deg,#ff6fa8,#9a82ff);
    transition:.5s;
}

.buttons{
    display:flex;
    justify-content:space-between;
    padding:22px 60px 30px;
}

.btn{
    border:none;
    border-radius:50px;
    padding:14px 24px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-3px);
}

.primary{
    background:#402b40;
    color:white;
    box-shadow:0 10px 25px rgba(60,40,60,.2);
}

.secondary{
    background:white;
    color:#402b40;
    border:1px solid #eadde6;
}

/* ============================= */
/* ANIMATIONS */
/* ============================= */

.boss{
    transform:rotate(3deg) scale(1.05);
}

.boss .arm.left{
    transform:rotate(70deg);
}

.boss .arm.right{
    transform:rotate(-70deg);
}

.angry{
    animation:angry .3s infinite alternate;
}

@keyframes angry{
    from{transform:translateX(-4px) rotate(-3deg)}
    to{transform:translateX(4px) rotate(3deg)}
}

.happy{
    animation:happy 1s infinite alternate;
}

@keyframes happy{
    from{transform:translateY(0)}
    to{transform:translateY(-12px)}
}

.dance{
    animation:dance .42s infinite alternate;
}

.dance .arm.left{
    animation:leftDance .42s infinite alternate;
}

.dance .arm.right{
    animation:rightDance .42s infinite alternate;
}

@keyframes dance{
    0%{
        transform:translateY(5px) rotate(-10deg) scale(1);
    }
    50%{
        transform:translateY(-12px) rotate(10deg) scale(1.06);
    }
    100%{
        transform:translateY(2px) rotate(-7deg) scale(.98);
    }
}

@keyframes leftDance{
    to{
        transform:rotate(-65deg) translateY(-10px);
    }
}

@keyframes rightDance{
    to{
        transform:rotate(65deg) translateY(-10px);
    }
}

/* ============================= */
/* FINALE */
/* ============================= */

.finale{
    min-height:720px;
    text-align:center;
    padding:55px 25px;
}

.hidden{
    display:none;
}

.badge{
    display:inline-block;
    background:white;
    border:1px solid #eadde6;
    padding:8px 15px;
    border-radius:50px;
    color:#ff6fa8;
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
}

.finale h2{
    font-family:"Baloo 2";
    font-size:5rem;
    line-height:.9;
    margin:25px 0 10px;
}

.verdict{
    font-family:"Baloo 2";
    color:#ff6fa8;
    font-size:28px;
    font-weight:900;
}

.stats{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:30px 0;
}

.stat{
    background:white;
    border-radius:20px;
    padding:15px 20px;
    min-width:150px;
    box-shadow:0 10px 25px rgba(80,50,80,.08);
}

.stat strong{
    display:block;
    font-size:24px;
}

.stat span{
    font-size:12px;
    color:#846c7c;
    font-weight:700;
}

.dance-floor{
    height:260px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.dance-floor::before{
    content:"";
    position:absolute;
    width:300px;
    height:110px;
    background:#e9ddff;
    border-radius:50%;
    bottom:25px;
}

.dancing-character{
    transform:scale(.8);
}

.music{
    position:absolute;
    top:10px;
    right:30%;
    font-size:45px;
    color:#ff6fa8;
    animation:music 1s infinite alternate;
}

@keyframes music{
    to{
        transform:translate(15px,-20px) rotate(15deg);
    }
}

.final-buttons{
    margin-top:10px;
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:750px){

    .card{
        min-height:850px;
    }

    .content{
        grid-template-columns:1fr;
        padding:5px 25px;
    }

    .character-zone{
        height:360px;
    }

    .text{
        text-align:center;
        padding:10px 5px 25px;
    }

    h1{
        font-size:3.3rem;
    }

    .description{
        font-size:15px;
    }

    .progress{
        margin:0 25px;
    }

    .buttons{
        padding:20px 25px 25px;
    }

    .finale h2{
        font-size:3.7rem;
    }

    .lilu{
        right:-70px;
    }
}
</style>
</head>

<body>

<div class="app">

<section class="card" id="story">

<div class="top">
    <span id="chapter">BABYLU UNIVERSE</span>
    <span id="counter">1 / 7</span>
</div>

<div class="content">

<div class="character-zone">

    <!-- BABYLU -->
    <div class="character" id="babylu">

        <div class="head">
            <div class="hair-back"></div>
            <div class="hair-left"></div>
            <div class="hair-right"></div>

            <div class="face">
                <span class="eye left"></span>
                <span class="eye right"></span>

                <span class="blush left"></span>

            </div>

            <div class="bow"></div>
        </div>

        <div class="body">

            <div class="arm left"></div>

</div>


<div class="text">

    </div>

</div>

</div>

</section>


<!-- ============================= -->
<!-- FINALE -->
<!-- ============================= -->

<section class="card finale hidden" id="finale">

    <div class="badge">
        THE COURT OF LILU ⚖️
    </div>

    <h2>

    </h2>

    <div class="verdict">

    </div>

    <div class="stats">

        <div class="stat">
            <strong>50%</strong>
            <span>Kuchu Puchu 🧸</span>
        </div>

        <div class="stat">
            <strong>50%</strong>
            <span>Pagal Queen 👑</span>
        </div>

        <div class="stat">
            <strong>100%</strong>
            <span>Lilu's Babylu ❤️</span>
        </div>

    </div>


    <div class="dance-floor">

        <div class="music">
            ♪
        </div>

        <div class="character dancing-character dance">

            <div class="head">

                <div class="hair-back"></div>
                <div class="hair-left"></div>
                <div class="hair-right"></div>

                <div class="face">

                    <span class="eye left"></span>
                    <span class="eye right"></span>

                    <span class="blush left"></span>
                    <span class="blush right"></span>

                </div>

                <div class="bow"></div>

            </div>

            <div class="body">

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="dress"></div>

                <div class="leg left">
                    <div class="shoe"></div>
                </div>

                <div class="leg right">
                    <div class="shoe"></div>
                </div>

            </div>

        </div>

    </div>

    <p style="font-family:'Baloo 2';font-size:22px;font-weight:800;">
        “Rama Sami Ki… Muthu Swami Ki…” 🎵
    </p>

    <p style="margin:10px auto 20px;color:#806c7a;">
        Babylu has officially entered <b>PAGAL DANCE MODE.</b>
    </p>

    <button class="btn primary" id="restart">
        ↻ Make Her Pagal Again
    </button>

</section>

</div>

</div>


<script>

const scenes = [

{
    eyebrow:"THE INNOCENT ONE",

    title:"Meet Babylu… 🥺💕",

    description:`
        To everyone else, she looks like a
        <b>Kuchu Puchu.</b>
        <br><br>
        Cute.<br>
        Innocent.<br>
        Sweet.<br>
        Adorable.
        <br><br>
        But Lilu knows the
        <b>REAL</b> Babylu.
    `,

    extra:"⚠️ Proceed at your own risk.",

    animation:"happy"
},

{
    eyebrow:"PAGAL HABIT #01",

    title:"Bossy Babylu 👑",

    description:`
        <b>“Lilu… come here.”</b>
        <br><br>

        “Why?”
        <br>
        “Just come.”
        <br><br>

        “Okay…”
        <br>
        “Why did you take so long?”
        😭
    `,

    extra:"Boss Level: ██████████ 100%",

    animation:"boss"
},

{
    eyebrow:"PAGAL HABIT #02",

    title:"Irritation Department 😤",

    description:`
        “Lilu…”
        <br><br>

        “Hmm?”
        <br><br>

        “Nothing.”
        <br><br>

        Five seconds later…
        <br><br>

        <b>“LILUUUUUUUU!”</b>
    `,

    extra:"PhD in irritating Lilu 🎓",

    animation:"angry"
},

{
    eyebrow:"THE K̶U̶C̶H̶U̶ P̶U̶C̶H̶U̶ TRAP",

    title:"The Cute Weapon 🧸",

    description:`
        Big innocent eyes.
        <br>
        Little blush.
        <br><br>

        <b>“Lilu 🥺👉👈”</b>
        <br><br>

        Lilu immediately melts.
        <br><br>

        Then comes…
        <b>one tiny favour.</b>
        <br><br>

        Then another.
        <br>
        Then another.
        <br><br>

        😭
    `,

    extra:"And somehow… she gets away with EVERYTHING.",

    animation:"happy"
},

{
    eyebrow:"⚠️ DANGER: PAGAL MODE",

    title:"THE DANCE INCIDENT 🕺",

    description:`
        Lilu has discovered Babylu's
        <b>most dangerous habit.</b>
        <br><br>

        She doesn't dance elegantly.
        <br>
        She doesn't dance normally.
        <br><br>

        She dances with
        <b>PURE PAGAL ENERGY.</b>
        😂
    `,

    extra:"Babylu: “Because I CAN. 😎”",

    animation:"dance"
},

{
    eyebrow:"PAGAL MODE ACTIVATED",

    title:"47 Different Babylus 🤪",

    description:`
        Hungry Babylu:
        <b>“Lilu 😡”</b>
        <br><br>

        Sleepy Babylu:
        <b>“Don't talk to me.”</b>
        <br><br>

        Ignored Babylu:
        <b>“LILUUUUUU!”</b>
        <br><br>

        Fast-reply Babylu:
        <b>“Why are you replying so fast?”</b>
    `,

    extra:"Lilu: “WHAT DO YOU WANT FROM ME 😭”",

    animation:"dance"
},

{
    eyebrow:"THE REAL REASON",

    title:"But Lilu Still Loves Her ❤️",

    description:`
        Yes…
        she's bossy.
        <br>
        She irritates me.
        <br>
        She randomly dances like a kid.
        <br>
        She has approximately
        <b>47 different pagal modes.</b>
        <br><br>

        But she's also
        <b>my favorite person.</b>
    `,

    extra:"Because that's my Babylu. ❤️",

    animation:"happy"
}

];

let current=0;

const babylu=document.getElementById("babylu");

const eyebrow=document.getElementById("eyebrow");

const title=document.getElementById("title");

const description=document.getElementById("description");

const extra=document.getElementById("extra");

const counter=document.getElementById("counter");

const progress=document.getElementById("progress");

const next=document.getElementById("next");

const back=document.getElementById("back");

const story=document.getElementById("story");

const finale=document.getElementById("finale");

function render(){

    const scene=scenes[current];

    eyebrow.innerHTML=scene.eyebrow;

    title.innerHTML=scene.title;

    description.innerHTML=scene.description;

    extra.innerHTML=scene.extra;

    counter.innerHTML=(current+1)+" / "+scenes.length;

    progress.style.width=
        ((current+1)/scenes.length*100)+"%";

    babylu.className="character";

    if(scene.animation){
        babylu.classList.add(scene.animation);
    }

    back.disabled=current===0;

    if(current===scenes.length-1){

        next.innerHTML="See The Verdict ⚖️";

    }else{

        next.innerHTML="Next Pagal Habit →";

    }

}

next.onclick=function(){

    if(current<scenes.length-1){

        current++;

        render();

    }else{

        story.classList.add("hidden");

        finale.classList.remove("hidden");

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

};

back.onclick=function(){

    if(current>0){

        current--;

        render();

    }

};

document.getElementById("restart").onclick=function(){

    current=0;

    finale.classList.add("hidden");

    story.classList.remove("hidden");

    render();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};

render();

</script>
